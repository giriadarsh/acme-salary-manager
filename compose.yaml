services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: acme_salary
      POSTGRES_USER: acme
      POSTGRES_PASSWORD: acme-local-db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acme -d acme_salary"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: postgres://acme:acme-local-db@db:5432/acme_salary
      HR_EMAIL: ${HR_EMAIL:-hr@acme.example}
      HR_PASSWORD: ${HR_PASSWORD:-acme-demo-2026!}
      SEED_DEMO: 'true'
      COOKIE_SECURE: 'false'
      PORT: 3000
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok) process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  postgres_data:
