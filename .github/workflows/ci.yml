name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: acme_test
          POSTGRES_USER: acme
          POSTGRES_PASSWORD: acme-test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U acme -d acme_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:db
        env:
          TEST_DATABASE_URL: postgres://acme:acme-test@localhost:5432/acme_test
      - run: docker compose config --quiet
      - run: docker compose build
