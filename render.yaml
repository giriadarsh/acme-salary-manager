services:
  - type: web
    name: acme-salary-manager
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: acme-salary-postgres
          property: connectionString
      - key: PORT
        value: '3000'
      - key: HR_EMAIL
        value: hr@acme.example
      - key: HR_PASSWORD
        sync: false
      - key: SEED_DEMO
        value: 'true'
      - key: COOKIE_SECURE
        value: 'true'
      - key: TRUST_PROXY
        value: 'true'
databases:
  - name: acme-salary-postgres
    plan: free
    postgresMajorVersion: '17'
    ipAllowList: []
